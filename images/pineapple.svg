<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 104" fill="none">
  <!--
    Pineapple brand mark — Scott Breen / The Buddy Family
    Standalone version with fixed colours, for the favicon and other standalone uses.
    For inline use in HTML, see the <symbol id="pineapple"> in index.html (its body
    takes currentColor so it can follow the theme).
  -->
  <defs>
    <clipPath id="pa-clip"><path d="M40 37 C58 37 67 49 67 69 C67 90 58 102 40 102 C22 102 13 90 13 69 C13 49 22 37 40 37 Z"/></clipPath>
    <radialGradient id="pa-shade" cx="0.3" cy="0.25" r="0.95">
      <stop offset="0.45" stop-color="#3D2600" stop-opacity="0"/>
      <stop offset="1" stop-color="#3D2600" stop-opacity="0.32"/>
    </radialGradient>
    <linearGradient id="pa-gold" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#EBC044"/>
      <stop offset="1" stop-color="#C08A14"/>
    </linearGradient>
  </defs>
  <!-- Crown: five leaves, back to front -->
  <path d="M31 43 C20 37 11 28 8 16 C19 19 29 28 37 41 Z" fill="#1F6B45"/>
  <path d="M49 43 C60 37 69 28 72 16 C61 19 51 28 43 41 Z" fill="#1F6B45"/>
  <path d="M33 43 C25 31 25 17 28 6 C36 15 41 28 42 42 Z" fill="#2A8556"/>
  <path d="M47 43 C55 31 55 17 52 6 C44 15 39 28 38 42 Z" fill="#2A8556"/>
  <path d="M33.5 44 C32 28 35.5 12 40 1 C44.5 12 48 28 46.5 44 Z" fill="#3BA36A"/>
  <!-- Body, then a diamond lattice clipped to it, then light and shade -->
  <path d="M40 37 C58 37 67 49 67 69 C67 90 58 102 40 102 C22 102 13 90 13 69 C13 49 22 37 40 37 Z" fill="url(#pa-gold)"/>
  <g clip-path="url(#pa-clip)">
    <ellipse cx="29" cy="56" rx="7" ry="12" fill="#FFFFFF" opacity="0.26" transform="rotate(-16 29 56)"/>
    <path d="M-42 37 L8.7 102 M122 37 L71.3 102 M-26 37 L24.7 102 M106 37 L55.3 102 M-10 37 L40.7 102 M90 37 L39.3 102 M6 37 L56.7 102 M74 37 L23.3 102 M22 37 L72.7 102 M58 37 L7.3 102 M38 37 L88.7 102 M42 37 L-8.7 102 M54 37 L104.7 102 M26 37 L-24.7 102 M70 37 L120.7 102 M10 37 L-40.7 102" stroke="#6B4300" stroke-opacity="0.3" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <rect x="13" y="37" width="54" height="65" fill="url(#pa-shade)"/>
  </g>
</svg>
