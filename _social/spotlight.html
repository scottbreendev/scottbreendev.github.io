<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feature spotlight (1080×1350)</title>
<link rel="stylesheet" href="kit.css">
</head>
<body>
<!--
  FEATURE SPOTLIGHT — 1080×1350 feed post. One screenshot, one short headline.
  Theme: data-app. Screenshot: any 600px-wide iPhone capture from ../images/shots/.
  Keep the headline to about four short lines.
-->
<main class="frame post spotlight" data-app="tz">

  <div class="copy">
    <div class="app-id">
      <span class="icon"><img src="../images/icons/tzbuddy.webp" alt=""></span>
      <span>Time Zone Buddy</span>         <!-- EDIT: app name -->
    </div>

    <div>
      <p class="overline">Feature spotlight</p>                        <!-- EDIT -->
      <h1 class="headline h-s">World clocks and a meeting planner.</h1>   <!-- EDIT: headline -->
      <p class="lede">One app for iPhone, iPad, Mac and Apple Watch.</p>   <!-- EDIT -->
    </div>

    <div class="sig">
      <span class="badge"><img src="../images/pineapple.svg" alt=""></span>
      <span class="sig-text"><b>Scott Breen</b><i class="handle"></i></span>
    </div>
  </div>

  <div class="visual">
    <div class="glow"></div>
    <div class="phone"><img src="../images/shots/tzbuddy-iphone.webp" alt=""></div>   <!-- EDIT: screenshot -->
  </div>

</main>
</body>
</html>
