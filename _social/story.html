<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Story (1080×1920)</title>
<link rel="stylesheet" href="kit.css">
</head>
<body>
<!--
  STORY — 1080×1920. Copy stays inside y 250–1670 (Instagram covers the rest).
  The empty band under the cue line is RESERVED for a sticker: drop a link
  sticker there in Instagram. For a poll or quiz, make the band taller:
  <div class="sticker-slot" style="--sticker-h: 320px">.
  The phone runs off the bottom on purpose.
-->
<main class="frame story" data-app="score">
  <div class="safe">

    <header class="row">
      <div class="app-id">
        <span class="icon"><img src="assets/scorebuddy-icon.svg" alt=""></span>
        <span>Score Buddy</span>          <!-- EDIT: app name -->
      </div>
      <span class="badge"><img src="../images/pineapple.svg" alt=""></span>
    </header>

    <h1 class="headline h-l">The Phase 10 score tracker.</h1>      <!-- EDIT: headline -->

    <p class="cue">Tap for the App Store <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg></p>            <!-- EDIT: what the sticker does -->
    <div class="sticker-slot"></div>                               <!-- RESERVED: sticker goes here -->

    <div class="stage">
      <div class="glow"></div>
      <div class="phone"><img src="../images/shots/scorebuddy-home.webp" alt=""></div>   <!-- EDIT: screenshot -->
    </div>

  </div>
</main>
</body>
</html>
