<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Carousel 2 — content slide (1080×1350)</title>
<link rel="stylesheet" href="kit.css">
</head>
<body>
<!--
  CAROUSEL, middle slides: CONTENT — 1080×1350. Copy this file once per point
  and change the step number, the count, the headline and the body.
  The app row is optional: delete it for a slide that isn't about one app.
-->
<main class="frame post carousel slide" data-app="brand">
  <img class="watermark" src="../images/pineapple.svg" alt="">

  <header class="row">
    <p class="overline">What's new · October 2026</p>      <!-- EDIT: same label as the cover -->
    <p class="count">1 / 2</p>                              <!-- EDIT: this slide / how many -->
  </header>

  <div>
    <p class="step">01</p>                                                       <!-- EDIT: step number -->
    <h1 class="headline h-m">Weekend Buddy is out now in Australia.</h1>        <!-- EDIT: the point -->
    <p class="lede">Dinners, parties, trips and birthdays, laid out weekend by weekend, with the working week left out.</p>   <!-- EDIT -->
    <div class="app-id">
      <span class="icon"><img src="../images/icons/weekendbuddy.webp" alt=""></span>
      <span>Weekend Buddy</span>
      <span class="tag">iPhone and iPad</span>
    </div>
  </div>

  <footer class="row">
    <div class="sig">
      <span class="badge"><img src="../images/pineapple.svg" alt=""></span>
      <span class="sig-text"><b>Scott Breen</b><i class="handle"></i></span>
    </div>
    <p class="cue">Swipe <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg></p>
  </footer>
</main>
</body>
</html>
