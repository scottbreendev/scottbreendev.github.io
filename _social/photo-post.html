<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photo post (1080×1350)</title>
<link rel="stylesheet" href="kit.css">
</head>
<body>
<!--
  PHOTO POST — 1080×1350 feed post or carousel cover. One full-bleed photo with a
  headline over the top and the signature over the bottom.
  Swap the photo: a 1080×1350 JPEG in assets/. Check it for number plates, faces,
  street signs and shop names before it goes in; crop them out rather than blur.
-->
<main class="frame post photo-post">
  <img class="photo-fill" src="assets/jacaranda-portrait.jpg" alt="">   <!-- EDIT: photo -->

  <div class="photo-top">
    <p class="overline">Made in Brisbane</p>                                  <!-- EDIT: label -->
    <h1 class="headline h-m">Built where the jacarandas bloom.</h1>          <!-- EDIT -->
  </div>

  <div class="sig">
    <span class="badge"><img src="../images/pineapple.svg" alt=""></span>
    <span class="sig-text"><b>Scott Breen</b><i class="handle"></i></span>
  </div>
</main>
</body>
</html>
