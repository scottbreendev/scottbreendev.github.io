<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Launch — Time Zone Buddy, now on Mac (1080×1350)</title>
<link rel="stylesheet" href="kit.css">
</head>
<body>
<!--
  LAUNCH / ANNOUNCEMENT, Mac version — 1080×1350 feed post.
  Same stencil as launch-weekendbuddy.html, with a Mac window in the stage
  instead of two phones (.stage-mac instead of .stage-phones).
-->
<main class="frame post launch" data-app="tz">

  <header class="row">
    <div class="app-id">
      <span class="icon"><img src="../images/icons/tzbuddy.webp" alt=""></span>
      <span>Time Zone Buddy</span>         <!-- EDIT: app name -->
      <span class="tag">New</span>         <!-- EDIT: tag, or delete the line -->
    </div>
    <div class="sig sig-rev">
      <span class="badge"><img src="../images/pineapple.svg" alt=""></span>
      <span class="sig-text"><b>Scott Breen</b><i class="handle"></i></span>
    </div>
  </header>

  <h1 class="headline h-xl">Now on Mac.</h1>      <!-- EDIT: headline -->
  <p class="lede">World clocks and a meeting planner in a proper Mac app, with everyone's working hours a click away in the menu bar.</p>   <!-- EDIT -->

  <div class="stage stage-mac">
    <div class="glow"></div>
    <img class="mac-window" src="../images/shots/tzbuddy-mac-light.webp" alt="">
    <img class="mac-popover" src="../images/shots/tzbuddy-menubar.webp" alt="">
  </div>

</main>
</body>
</html>
