<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Story — meet the family (1080×1920)</title>
<link rel="stylesheet" href="kit.css">
</head>
<body>
<!--
  FAMILY STORY — 1080×1920, the story version of family.html.
  Copy stays inside y 250–1670. The empty band under the cue line is RESERVED for
  a link sticker. Add or remove an <li> and the cards share the height.
-->
<main class="frame story family-story" data-app="brand">
  <div class="safe">

    <header class="row">
      <p class="overline">The Buddy Family</p>                     <!-- EDIT -->
      <span class="badge"><img src="../images/pineapple.svg" alt=""></span>
    </header>

    <h1 class="headline h-l">Meet the family.</h1>                 <!-- EDIT: headline -->

    <ul class="worlds">
      <li class="world" data-app="tz">
        <span class="icon"><img src="../images/icons/tzbuddy.webp" alt=""></span>
        <span class="world-text"><b>Time Zone Buddy</b><span>World clocks and meeting planner</span></span>
      </li>
      <li class="world" data-app="weekend">
        <span class="icon"><img src="../images/icons/weekendbuddy.webp" alt=""></span>
        <span class="world-text"><b>Weekend Buddy</b><span>Your weekends, at a glance</span></span>
      </li>
      <li class="world" data-app="commission">
        <span class="icon"><img src="../images/commissionbuddy-icon.svg" alt=""></span>
        <span class="world-text"><b>Commission Buddy</b><span>For Australian real estate agents</span></span>
      </li>
      <li class="world" data-app="yakable">
        <span class="icon"><img src="../images/icons/yakable.webp" alt=""></span>
        <span class="world-text"><b>Yakable</b><span>Grab the convo by the horns</span></span>
      </li>
      <li class="world" data-app="score">
        <span class="icon"><img src="assets/scorebuddy-icon.svg" alt=""></span>
        <span class="world-text"><b>Score Buddy</b><span>The Phase 10 score tracker</span></span>
      </li>
    </ul>

    <p class="cue">See all five <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg></p>                          <!-- EDIT: what the sticker does -->
    <div class="sticker-slot"></div>                                 <!-- RESERVED: sticker goes here -->

  </div>
</main>
</body>
</html>
