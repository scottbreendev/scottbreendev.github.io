<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Score Buddy for Phase 10 app icon. On the website this lives only as an inline
    <symbol id="score-buddy-icon"> in ../../index.html, which another file cannot
    reference, so this is a standalone copy of that symbol on the same navy tile the site uses.
  -->
  <defs>
    <linearGradient id="sb-fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3478F6"/>
      <stop offset="100%" stop-color="#2860C5"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="#0F132F"/>
  <rect x="143.36" y="180.22" width="516.10" height="722.53" rx="103.22" fill="#3478F6" fill-opacity="0.3" transform="rotate(-8 512 512)"/>
  <rect x="327.68" y="165.48" width="516.10" height="722.53" rx="103.22" fill="#3478F6" fill-opacity="0.5" transform="rotate(4 512 512)"/>
  <rect x="253.95" y="150.73" width="516.10" height="722.53" rx="103.22" fill="url(#sb-fg)"/>
  <text x="512" y="610.06" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="258.05" font-weight="700" text-anchor="middle" fill="white">10</text>
</svg>
