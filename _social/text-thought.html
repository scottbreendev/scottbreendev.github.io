<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Text post — a thought (1080×1350)</title>
<link rel="stylesheet" href="kit.css">
</head>
<body>
<!--
  TEXT / BUILD-IN-PUBLIC — 1080×1350 feed post. A thought or a lesson, set big.
  Wrap the words to pick out in <span class="hi">…</span>.
  Long line? Drop the headline from h-l to h-m. Dark version: data-app="brand-dark".
-->
<main class="frame post text-post" data-app="brand">
  <img class="watermark" src="../images/pineapple.svg" alt="">

  <p class="overline">Building in public</p>      <!-- EDIT: label -->

  <div>
    <h1 class="headline h-l">Five small apps, each built to do <span class="hi">one everyday job</span> really well.</h1>   <!-- EDIT -->
    <p class="lede">That's the Buddy Family.</p>   <!-- EDIT, or delete -->
  </div>

    <div class="sig">
      <span class="badge"><img src="../images/pineapple.svg" alt=""></span>
      <span class="sig-text"><b>Scott Breen</b><i class="handle"></i></span>
    </div>
</main>
</body>
</html>
