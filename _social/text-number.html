<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Text post — a number (1080×1350)</title>
<link rel="stylesheet" href="kit.css">
</head>
<body>
<!--
  TEXT / BUILD-IN-PUBLIC, number version — 1080×1350 feed post.
  One big number, then what it means. Shown here in the dark brand theme;
  use data-app="brand" for cream.
-->
<main class="frame post text-post" data-app="brand-dark">
  <img class="watermark" src="../images/pineapple.svg" alt="">

  <p class="overline">By the numbers</p>      <!-- EDIT: label -->

  <div>
    <p class="numeral">5</p>                                         <!-- EDIT: the number -->
    <h1 class="headline h-m">small apps in the Buddy Family.</h1>   <!-- EDIT: what it counts -->
    <p class="lede">Each one built to do one everyday job really well.</p>   <!-- EDIT, or delete -->
  </div>

    <div class="sig">
      <span class="badge"><img src="../images/pineapple.svg" alt=""></span>
      <span class="sig-text"><b>Scott Breen</b><i class="handle"></i></span>
    </div>
</main>
</body>
</html>
