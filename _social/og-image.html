<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Link preview / Open Graph image (1200×630)</title>
<link rel="stylesheet" href="kit.css">
</head>
<body>
<!--
  LINK PREVIEW (Open Graph) — 1200×630. Exports to out/og-image.png.
  To use it on the site, copy that file over ../images/og-image.png.
-->
<main class="frame og" data-app="brand">
  <div class="glow"></div>

  <div class="copy">
    <h1 class="headline">Apps that become your <span class="hi">everyday</span> buddy.</h1>
    <p class="lede">Scott Breen — independent app developer</p>
    <div class="dock">
      <span class="icon"><img src="../images/icons/weekendbuddy.webp" alt=""></span>
      <span class="icon"><img src="../images/icons/tzbuddy.webp" alt=""></span>
      <span class="icon"><img src="assets/scorebuddy-icon.svg" alt=""></span>
      <span class="icon"><img src="../images/commissionbuddy-icon.svg" alt=""></span>
      <span class="icon"><img src="../images/icons/yakable.webp" alt=""></span>
    </div>
  </div>

  <img class="og-mark" src="../images/pineapple.svg" alt="">
</main>
</body>
</html>
