<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reel cover (1080×1920)</title>
<link rel="stylesheet" href="kit.css">
</head>
<body>
<!--
  REEL COVER — 1080×1920. Upload it as the reel's cover image.
  Everything sits inside y 330–1604, so it survives both crops Instagram makes:
  the profile grid (centre 3:4, y 240–1680) and the feed (centre 4:5, y 285–1635).
  No text in the top 220px or the bottom 450px; the only thing down there is the
  pineapple. Keep the headline to two lines.
-->
<main class="frame reel" data-app="weekend">
  <div class="safe">

    <h1 class="headline h-l">Your weekends, at a glance.</h1>      <!-- EDIT: reel title, two lines -->

    <div class="stage">
      <div class="glow"></div>
      <div class="phone phone-back"><img src="../images/shots/weekendbuddy-widgets.webp" alt=""></div>
      <div class="phone phone-front"><img src="../images/shots/weekendbuddy-weekends.webp" alt=""></div>
    </div>

    <div class="app-id">
      <span class="icon"><img src="../images/icons/weekendbuddy.webp" alt=""></span>
      <span>Weekend Buddy</span>          <!-- EDIT: app name -->
    </div>

    <div class="sign-off"><span class="badge"><img src="../images/pineapple.svg" alt=""></span></div>

  </div>
</main>
</body>
</html>
